spring.application.name=ms-campuslab-bookings

server.port=${SERVER_PORT:8081}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
services.catalog.url=${CATALOG_SERVICE_URL:http://localhost:8082}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Apache Kafka - CampusLab
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}

# Serializacion del productor
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer

# Confirmacion y reintentos del productor
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
# Evita duplicados al reintentar el envio
spring.kafka.producer.properties[enable.idempotence]=true

# No enviar informacion del tipo Java en los headers
spring.kafka.producer.properties[spring.json.add.type.headers]=false

# Topico de reservas
campuslab.kafka.topics.bookings=bookings.events

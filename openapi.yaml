openapi: 3.0.3

info:
  title: CampusLab Bookings API
  version: 1.0.0

servers:
  - url: http://localhost:8081

tags:
  - name: Bookings

paths:

  /api/bookings:

    post:
      tags:
        - Bookings
      summary: Crear reserva
      operationId: createBooking
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookingRequest'
      responses:
        '201':
          description: Reserva creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResponse'
        '400':
          description: Solicitud inválida
        '401':
          description: No autenticado
        '403':
          description: No autorizado

    get:
      tags:
        - Bookings
      summary: Listar reservas
      operationId: getBookings
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/BookingStatus'

        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date

        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date

      responses:
        '200':
          description: Reservas encontradas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookingResponse'
        '401':
          description: No autenticado
        '403':
          description: No autorizado

  /api/bookings/{id}:

    get:
      tags:
        - Bookings
      summary: Obtener reserva por ID
      operationId: getBookingById
      security:
        - bearerAuth: []

      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64

      responses:
        '200':
          description: Reserva encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResponse'
        '404':
          description: Reserva no encontrada
        '401':
          description: No autenticado
        '403':
          description: No autorizado

  /api/bookings/{id}/status:

    put:
      tags:
        - Bookings
      summary: Cambiar estado de reserva
      operationId: updateBookingStatus
      security:
        - bearerAuth: []

      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBookingStatusRequest'

      responses:
        '200':
          description: Estado actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResponse'
        '400':
          description: Cambio de estado inválido
        '404':
          description: Reserva no encontrada
        '401':
          description: No autenticado
        '403':
          description: No autorizado

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    CreateBookingRequest:
      type: object
      required:
        - resourceId
        - startTime
        - endTime
      properties:
        resourceId:
          type: integer
          format: int64
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time

    UpdateBookingStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          $ref: '#/components/schemas/BookingStatus'

    BookingResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        resourceId:
          type: integer
          format: int64
        userId:
          type: string
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/BookingStatus'
        createdAt:
          type: string
          format: date-time

    BookingStatus:
      type: string
      enum:
        - REQUESTED
        - APPROVED
        - IN_PREPARATION
        - IN_USE
        - RETURNED
        - CANCELLED

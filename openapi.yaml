openapi: 3.0.3

info:
  title: CampusLab Bookings Internal API
  version: 1.0.0
  description: >-
    API interna de reservas. Este microservicio no implementa autenticación ni
    autorización HTTP; la autenticación JWT y los roles de las rutas públicas
    se aplican en ms-campuslab-bff.

servers:
  - url: http://localhost:8081

tags:
  - name: Bookings

paths:
  /api/v1/bookings:
    post:
      tags:
        - Bookings
      summary: Crear reserva
      operationId: createBooking
      parameters:
        - name: userId
          in: query
          required: false
          description: Identificador recibido por el BFF desde el usuario autenticado
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookingRequest'
      responses:
        '201':
          description: Reserva creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResponse'
        '400':
          description: Fecha, hora o duración de la reserva inválida
        '404':
          description: Recurso inexistente
        '409':
          description: El recurso no tiene cupos disponibles

    get:
      tags:
        - Bookings
      summary: Listar reservas
      operationId: getBookings
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/BookingStatus'
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Reservas encontradas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookingResponse'

  /api/v1/bookings/user/{userId}:
    get:
      tags:
        - Bookings
      summary: Listar reservas de un usuario
      operationId: getBookingsByUserId
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Reservas del usuario encontradas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookingResponse'

  /api/v1/bookings/{id}:
    get:
      tags:
        - Bookings
      summary: Obtener reserva por ID
      operationId: getBookingById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Reserva encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResponse'
        '404':
          description: Reserva no encontrada

  /api/v1/bookings/{id}/status:
    put:
      tags:
        - Bookings
      summary: Cambiar estado de reserva
      operationId: updateBookingStatus
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBookingStatusRequest'
      responses:
        '200':
          description: Estado actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResponse'
        '400':
          description: Cambio de estado inválido
        '404':
          description: Reserva no encontrada
        '409':
          description: Transición de estado no permitida

  /api/v1/bookings/{id}/admin-status:
    put:
      tags:
        - Bookings
      summary: Actualizar manualmente el estado de una reserva
      description: Cambio administrativo que acepta estados definidos por el dominio.
      operationId: updateBookingAdminStatus
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBookingStatusRequest'
      responses:
        '200':
          description: Estado actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResponse'
        '400':
          description: Estado ausente o inválido
        '404':
          description: Reserva no encontrada

components:
  schemas:
    CreateBookingRequest:
      type: object
      required:
        - resourceId
        - startTime
        - endTime
      properties:
        resourceId:
          type: integer
          format: int64
        startTime:
          type: string
          description: Hora local de America/Santiago, sin offset ni sufijo Z.
          example: '2026-10-18T15:00:00'
        endTime:
          type: string
          description: Hora local de America/Santiago, sin offset ni sufijo Z.
          example: '2026-10-18T16:00:00'

    UpdateBookingStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          $ref: '#/components/schemas/BookingStatus'

    BookingStatus:
      type: string
      enum:
        - REQUESTED
        - APPROVED
        - IN_PREPARATION
        - IN_USE
        - RETURNED
        - CANCELLED

    BookingResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        resourceId:
          type: integer
          format: int64
        userId:
          type: string
        startTime:
          type: string
          description: Hora local de America/Santiago, sin offset ni sufijo Z.
          example: '2026-10-18T15:00:00'
        endTime:
          type: string
          description: Hora local de America/Santiago, sin offset ni sufijo Z.
          example: '2026-10-18T16:00:00'
        status:
          $ref: '#/components/schemas/BookingStatus'
        createdAt:
          type: string
          description: Hora local de America/Santiago, sin offset ni sufijo Z.
          example: '2026-10-17T12:00:00'
